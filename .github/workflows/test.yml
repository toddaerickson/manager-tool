name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests-django-sqlite:
    name: pytest (Django, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager-tool-django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: manager-tool-django/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check
      - name: Run pytest
        run: pytest -v

  smoke-pg-django:
    name: Postgres smoke test (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
    defaults:
      run:
        working-directory: manager-tool-django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: manager-tool-django/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Run Django PG smoke
        run: python scripts/smoke_pg_django.py

  validate-render-blueprint:
    name: Validate render.yaml
    # Catches silent blueprint-schema bugs (e.g. `command:` vs
    # `startCommand:`) that don't fail the deploy but quietly skip
    # creating new services. PR #71 → PR #107 shipped one such bug
    # that blocked cron creation for ~3 weeks before anyone noticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install render CLI
        # Pinned version: bump when needed. v2.18.0 matches the local
        # toolchain used when this job was added.
        run: |
          curl -fsSL -o /tmp/render-cli.zip \
            "https://github.com/render-oss/cli/releases/download/v2.18.0/cli_2.18.0_linux_amd64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/render-cli.zip').extractall('/tmp/render-cli')"
          install -m 755 /tmp/render-cli/cli_v2.18.0 /usr/local/bin/render
          render --version
      - name: Validate render.yaml
        run: render blueprints validate ./render.yaml
