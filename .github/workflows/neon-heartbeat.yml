name: Neon keepalive

# Pings the Neon project API weekly to prevent free-tier suspension.
# Neon suspends databases after 5 days of inactivity and can delete
# data after extended idle periods. This workflow ensures the project
# stays active even if no PRs or deploys happen for weeks.
#
# Uses the existing NEON_API_KEY secret and NEON_PROJECT_ID variable.
# No DATABASE_URL needed — the API call itself counts as activity.

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9:00 UTC (4 AM CDT)
  workflow_dispatch:

jobs:
  heartbeat:
    name: Neon keepalive ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Neon project
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o /tmp/neon-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Neon project responsive (HTTP 200)"
            # Extract project name to confirm we hit the right one
            python3 -c "import json; d=json.load(open('/tmp/neon-response.json')); print(f'  Project: {d[\"project\"][\"name\"]}')"
          else
            echo "::error::Neon keepalive failed — HTTP $HTTP_CODE"
            cat /tmp/neon-response.json >&2 || true
            exit 1
          fi
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
