name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  smoke_pg_neon:
    name: Postgres smoke (Neon branch)
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}-streamlit
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
      - name: Set DATABASE_URL and wait for compute
        run: |
          DB_URL="${{ steps.create_neon_branch.outputs.db_url }}"
          if [ -z "${DB_URL}" ]; then
            echo "FAIL: db_url output is empty — check NEON_PROJECT_ID and NEON_API_KEY"
            exit 1
          fi
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
          echo "Polling compute readiness (url len=${#DB_URL})..."
          for i in $(seq 1 10); do
            if psql "${DB_URL}" -c "SELECT 1" >/dev/null 2>&1; then
              echo "Compute ready (attempt $i)"
              exit 0
            fi
            echo "Not ready (attempt $i/10), waiting 3s..."
            sleep 3
          done
          echo "FAIL: Neon compute not ready after 30s"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Reset Neon branch database
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 \
            -c "DROP OWNED BY CURRENT_USER CASCADE" \
            -c "CREATE SCHEMA IF NOT EXISTS public"
          echo "[ok] database reset"
      - name: Run Streamlit smoke test against Neon branch
        run: python scripts/smoke_pg.py

  smoke_pg_django_neon:
    name: Postgres smoke Django (Neon branch)
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager-tool-django
    steps:
      - name: Get branch expiration date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}-django
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
      - name: Set DATABASE_URL and wait for compute
        run: |
          DB_URL="${{ steps.create_neon_branch.outputs.db_url }}"
          if [ -z "${DB_URL}" ]; then
            echo "FAIL: db_url output is empty — check NEON_PROJECT_ID and NEON_API_KEY"
            exit 1
          fi
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
          echo "Polling compute readiness (url len=${#DB_URL})..."
          for i in $(seq 1 10); do
            if psql "${DB_URL}" -c "SELECT 1" >/dev/null 2>&1; then
              echo "Compute ready (attempt $i)"
              exit 0
            fi
            echo "Not ready (attempt $i/10), waiting 3s..."
            sleep 3
          done
          echo "FAIL: Neon compute not ready after 30s"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: manager-tool-django/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Reset Neon branch database
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 \
            -c "DROP OWNED BY CURRENT_USER CASCADE" \
            -c "CREATE SCHEMA IF NOT EXISTS public"
          echo "[ok] database reset"
      - name: Run Django smoke test against Neon branch
        run: python scripts/smoke_pg_django.py

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch (Streamlit)
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}-streamlit
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Delete Neon Branch (Django)
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}-django
          api_key: ${{ secrets.NEON_API_KEY }}
