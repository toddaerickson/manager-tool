{% extends "base.html" %}

{% block title %}Career Development — Manager Tool{% endblock %}

{% block content %}
<div class="max-w-4xl">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold">Career Development</h1>
    <p class="text-sm text-slate-500 mt-1">Skills, development plans, and career conversations for your team.</p>
  </header>

  <div class="flex items-center gap-3 mb-6">
    <label class="text-sm text-slate-600">Filter by member:</label>
    <select onchange="window.location='?member='+this.value"
            class="text-base sm:text-sm border border-slate-300 rounded px-2 py-1">
      <option value="">All members</option>
      {% for m in members %}
        <option value="{{ m.id }}" {% if selected_member == m.id|stringformat:"d" %}selected{% endif %}>{{ m.name }}</option>
      {% endfor %}
    </select>
  </div>

  {% include "_partials/career_dev_content.html" %}
</div>
{% endblock %}
