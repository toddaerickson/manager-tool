{% extends "base.html" %}

{% block title %}Team — Manager Tool{% endblock %}

{% block content %}
<div class="max-w-5xl">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold">Team</h1>
    <p class="text-sm text-slate-500 mt-1">{{ members|length }} member{{ members|length|pluralize }}</p>
  </header>

  <details class="mb-6 bg-white rounded-lg shadow-sm border border-slate-200" {% if not members %}open{% endif %}>
    <summary class="px-6 py-3 cursor-pointer select-none font-medium">Add member</summary>
    <div id="member-form-wrap" class="px-6 pb-6">
      {% include "_partials/team_member_form.html" %}
    </div>
  </details>

  <div id="member-list">
    {% include "_partials/team_member_list.html" %}
  </div>
</div>
{% endblock %}
