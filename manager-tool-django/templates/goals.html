{% extends "base.html" %}

{% block title %}Goals — Manager Tool{% endblock %}

{% block content %}
<div class="max-w-4xl">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold">Goals</h1>
    <p class="text-sm text-slate-500 mt-1">Quarterly goals for your team members.</p>
  </header>

  <div class="flex items-center gap-3 mb-6">
    <label for="member-filter" class="text-sm text-slate-600">Filter by member:</label>
    <select id="member-filter" onchange="window.location='?member='+this.value"
            class="text-base sm:text-sm border border-slate-300 rounded px-2 py-1.5">
      <option value="">All members</option>
      {% for m in members %}
        <option value="{{ m.id }}" {% if selected_member == m.id|stringformat:"d" %}selected{% endif %}>{{ m.name }}</option>
      {% endfor %}
    </select>
  </div>

  <details class="mb-6 bg-white border border-slate-200 rounded-md" {% if not goals %}open{% endif %}>
    <summary class="px-3 py-2 cursor-pointer select-none font-medium">Add goal</summary>
    <div id="goal-form-wrap" class="px-3 pb-3">
      {% include "_partials/goal_form.html" %}
    </div>
  </details>

  <div id="goal-list">
    {% include "_partials/goal_list.html" %}
  </div>
</div>
{% endblock %}
