<form method="post" action="{% url 'decisions-add' %}" class="space-y-3">
  {% csrf_token %}

  <div>
    <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-slate-700">Title *</label>
    {{ form.title }}
    {% if form.title.errors %}<p class="text-xs text-red-600 mt-1">{{ form.title.errors.0 }}</p>{% endif %}
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label for="{{ form.context.id_for_label }}" class="block text-sm font-medium text-slate-700">Context</label>
      {{ form.context }}
    </div>
    <div>
      <label for="{{ form.alternatives.id_for_label }}" class="block text-sm font-medium text-slate-700">Alternatives considered</label>
      {{ form.alternatives }}
    </div>
  </div>

  <div>
    <label for="{{ form.rationale.id_for_label }}" class="block text-sm font-medium text-slate-700">Rationale</label>
    {{ form.rationale }}
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <div>
      <label for="{{ form.expected_outcome.id_for_label }}" class="block text-sm font-medium text-slate-700">Expected outcome</label>
      {{ form.expected_outcome }}
    </div>
    <div>
      <label for="{{ form.review_date.id_for_label }}" class="block text-sm font-medium text-slate-700">Review date</label>
      {{ form.review_date }}
    </div>
    <div>
      <label for="{{ form.status.id_for_label }}" class="block text-sm font-medium text-slate-700">Status</label>
      {{ form.status }}
    </div>
  </div>

  <div class="flex justify-end">
    <button type="submit" class="bg-accent-700 text-white text-sm px-4 py-2 rounded hover:bg-accent-800">Log decision</button>
  </div>
</form>
