<form method="post" action="{% url 'meetings-add' %}" class="space-y-3">
  {% csrf_token %}

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm font-medium text-slate-700">Team member *</label>
      {{ form.team_member }}
      {% if form.team_member.errors %}<p class="text-xs text-red-600 mt-1">{{ form.team_member.errors.0 }}</p>{% endif %}
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Date *</label>
      {{ form.session_date }}
      {% if form.session_date.errors %}<p class="text-xs text-red-600 mt-1">{{ form.session_date.errors.0 }}</p>{% endif %}
    </div>
  </div>

  <div class="flex justify-end">
    <button type="submit" class="bg-accent-700 text-white text-sm px-4 py-2 rounded hover:bg-accent-800">Start meeting</button>
  </div>
</form>
