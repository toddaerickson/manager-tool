{% if deleted_members %}
<details class="bg-slate-50 rounded-lg border border-slate-200" open>
  <summary class="px-6 py-3 cursor-pointer select-none text-sm font-medium text-slate-600">
    Recently deleted ({{ deleted_members|length }}) — restore within 30 days
  </summary>
  <table class="min-w-full mt-2">
    <thead class="text-left text-xs uppercase tracking-wider text-slate-500">
      <tr>
        <th class="px-4 py-2">Name</th>
        <th class="px-4 py-2">Deleted</th>
        <th class="px-4 py-2 w-16"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200">
      {% for m in deleted_members %}
      <tr id="deleted-row-{{ m.id }}">
        <td class="px-4 py-2 text-slate-700">{{ m.name }}</td>
        <td class="px-4 py-2 text-xs text-slate-500 tabular-nums">{{ m.deleted_at|date:"Y-m-d H:i" }}</td>
        <td class="px-4 py-2 text-right">
          <button type="button"
                  hx-post="{% url 'team-restore' m.id %}"
                  hx-target="#deleted-section"
                  hx-swap="innerHTML"
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  class="inline-flex items-center min-h-11 sm:min-h-8 px-2 rounded text-xs font-medium text-slate-600 hover:bg-slate-100">
            Restore
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</details>
{% endif %}
