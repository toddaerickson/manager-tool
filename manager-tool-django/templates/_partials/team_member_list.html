{% if members %}
<div class="bg-white border border-slate-200 rounded-md overflow-hidden">
<table class="min-w-full">
  <thead class="text-left text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200">
    <tr>
      <th class="px-3 py-1.5 font-medium">Name</th>
      <th class="px-3 py-1.5 font-medium">Email</th>
      <th class="px-3 py-1.5 font-medium">Role</th>
      <th class="px-3 py-1.5 font-medium">Start date</th>
      <th class="px-3 py-1.5 font-medium w-16"></th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100 text-sm">
    {% for m in members %}
    <tr id="member-row-{{ m.id }}" class="hover:bg-slate-50">
      <td class="px-3 py-1.5 font-medium">{{ m.name }}</td>
      <td class="px-3 py-1.5 text-slate-600">{{ m.email|default:"—" }}</td>
      <td class="px-3 py-1.5 text-slate-600">{{ m.role|default:"—" }}</td>
      <td class="px-3 py-1.5 text-slate-600 tabular-nums">{{ m.start_date|default:"—" }}</td>
      <td class="px-3 py-1.5 text-right">
        <button type="button"
                hx-delete="{% url 'team-delete' m.id %}"
                hx-target="#member-row-{{ m.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete {{ m.name }}? You can restore within 30 days from the Recently deleted section."
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                class="text-xs text-red-600 hover:text-red-800">
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="text-sm text-slate-500">No team members yet — add one above.</p>
{% endif %}
