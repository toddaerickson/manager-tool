{% if completed %}
<details class="bg-white border border-slate-200 rounded-md overflow-x-auto">
  <summary class="px-3 py-2 cursor-pointer select-none text-sm font-medium text-slate-600">
    Recently completed ({{ completed|length }})
  </summary>
  <table class="min-w-full">
    <thead class="text-left text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200">
      <tr>
        <th class="px-3 py-1.5 font-medium">Description</th>
        <th class="px-3 py-1.5 font-medium">Completed</th>
        <th class="px-3 py-1.5 font-medium"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100 text-sm">
      {% for t in completed %}
      <tr id="todo-completed-row-{{ t.id }}" class="hover:bg-slate-50">
        <td class="px-3 py-1.5 text-slate-700 line-through">{{ t.description }}</td>
        <td class="px-3 py-1.5 text-xs text-slate-500 tabular-nums">
          {% if t.completed_at %}{{ t.completed_at|date:"Y-m-d H:i" }}{% else %}—{% endif %}
        </td>
        <td class="px-3 py-1.5 text-right">
          <button type="button"
                  hx-post="{% url 'todos-uncomplete' t.id %}"
                  hx-target="#todo-completed"
                  hx-swap="innerHTML"
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  class="inline-flex items-center min-h-11 sm:min-h-8 px-2 rounded text-xs font-medium text-slate-600 hover:bg-slate-100">
            Restore
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</details>
{% endif %}
