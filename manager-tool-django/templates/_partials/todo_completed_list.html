{% if completed %}
<details class="bg-slate-50 rounded-lg border border-slate-200">
  <summary class="px-6 py-3 cursor-pointer select-none text-sm font-medium text-slate-600">
    Recently completed ({{ completed|length }})
  </summary>
  <table class="min-w-full mt-2">
    <thead class="text-left text-xs uppercase tracking-wider text-slate-500">
      <tr>
        <th class="px-4 py-2">Description</th>
        <th class="px-4 py-2">Completed</th>
        <th class="px-4 py-2 w-24"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200">
      {% for t in completed %}
      <tr id="todo-completed-row-{{ t.id }}">
        <td class="px-4 py-2 text-slate-700 line-through">{{ t.description }}</td>
        <td class="px-4 py-2 text-xs text-slate-500 tabular-nums">
          {% if t.completed_at %}{{ t.completed_at|date:"Y-m-d H:i" }}{% else %}—{% endif %}
        </td>
        <td class="px-4 py-2 text-right">
          <button type="button"
                  hx-post="{% url 'todos-uncomplete' t.id %}"
                  hx-target="#todo-completed"
                  hx-swap="innerHTML"
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  class="text-xs text-slate-700 hover:text-slate-900 underline">
            Restore
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</details>
{% endif %}
