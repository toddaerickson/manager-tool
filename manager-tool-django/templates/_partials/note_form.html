<form method="post" action="{% url 'notes-add' %}" class="space-y-3">
  {% csrf_token %}

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <div>
      <label for="{{ form.team_member.id_for_label }}" class="block text-sm font-medium text-slate-700">Team member</label>
      {{ form.team_member }}
    </div>
    <div>
      <label for="{{ form.note_date.id_for_label }}" class="block text-sm font-medium text-slate-700">Date *</label>
      {{ form.note_date }}
      {% if form.note_date.errors %}<p class="text-xs text-red-600 mt-1">{{ form.note_date.errors.0 }}</p>{% endif %}
    </div>
    <div>
      <label for="{{ form.category.id_for_label }}" class="block text-sm font-medium text-slate-700">Category</label>
      {{ form.category }}
    </div>
  </div>

  <div>
    <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-slate-700">Note *</label>
    {{ form.content }}
    {% if form.content.errors %}<p class="text-xs text-red-600 mt-1">{{ form.content.errors.0 }}</p>{% endif %}
  </div>

  <div class="flex justify-end">
    <button type="submit" class="bg-accent-700 text-white text-sm px-4 py-2 rounded hover:bg-accent-800">Add note</button>
  </div>
</form>
