# Render IaC: defines the Django web service.
# When the user connects the repo to Render and Render reads this file,
# the service is created automatically. Secrets still need to be pasted
# into the Render dashboard (sync: false).
#
# Phase 4: deploy points at the Neon dev-django branch via DATABASE_URL.
# Phase 7 cutover: swap DATABASE_URL to point at production Neon.

services:
  - type: web
    name: manager-tool-django
    runtime: python
    rootDir: manager-tool-django
    plan: starter  # $7/mo — avoids cold starts (per MIGRATION_PLAN.md)
    region: oregon  # closest to most US clients; change if Neon dev is elsewhere
    branch: main
    autoDeploy: true

    buildCommand: |
      pip install -r requirements.txt && \
      TAILWINDCSS_VERSION=v3.4.17 tailwindcss -c tailwind.config.js -i static/src/input.css -o static/css/tw.css --minify && \
      python manage.py collectstatic --noinput && \
      python manage.py migrate --fake-initial

    # --threads 4 switches gunicorn to the gthread worker class: up to
    # 2x4=8 concurrent request threads, each holding its own DB
    # connection (plus AI background threads and overlapping crons).
    # Budget stays well under Neon's per-plan connection limit; see
    # settings.py CONN_MAX_AGE. Without threads, one multi-second
    # Anthropic call blocks the sole sync worker for every user.
    startCommand: gunicorn mt.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60

    # /health/ returns JSON {status, db, git_sha} and runs SELECT 1 —
    # 503 when the database is unreachable, so Render stops routing to
    # a booted-but-dead service (not just a live marketing page).
    healthCheckPath: /health/

    envVars:
      # Secrets — paste values in Render dashboard:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true  # Render generates a strong random value
      - key: CONFIG_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Static config — committed values:
      - key: MANAGER_TOOL_ENV
        value: prod
      - key: DJANGO_ALLOWED_HOSTS
        # RENDER_EXTERNAL_HOSTNAME is auto-added at runtime by settings.py;
        # add custom domain here if/when one is configured.
        value: ""
      - key: PYTHON_VERSION
        value: "3.11"

  # --- Cron jobs (Phase 6) ---

  - type: cron
    name: weekly-digest
    runtime: python
    repo: https://github.com/toddaerickson/manager-tool
    rootDir: manager-tool-django
    plan: starter
    region: oregon
    branch: main
    schedule: "0 13 * * MON"  # 9 AM ET (UTC-4) every Monday
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_weekly_digests
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      # Without CONFIG_ENCRYPTION_KEY, decryption fails and get_config
      # logs ERROR + treats SMTP/Anthropic creds as unset, so the cron
      # exits "no managers configured" every Monday. The ERROR line in
      # the cron logs is the tell — but keep the key set here so it
      # never comes to that.
      - key: CONFIG_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MANAGER_TOOL_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.11"

  - type: cron
    name: purge-deleted-members
    runtime: python
    repo: https://github.com/toddaerickson/manager-tool
    rootDir: manager-tool-django
    plan: starter
    region: oregon
    branch: main
    schedule: "0 5 * * *"  # 1 AM ET daily
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py purge_deleted_team_members
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: CONFIG_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MANAGER_TOOL_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.11"

  - type: cron
    name: inbox-email-poll
    runtime: python
    repo: https://github.com/toddaerickson/manager-tool
    rootDir: manager-tool-django
    plan: starter
    region: oregon
    branch: main
    schedule: "*/15 * * * *"  # every 15 minutes (roadmap PR 5)
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py poll_inbox_email
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      # CONFIG_ENCRYPTION_KEY is REQUIRED here: the IMAP app password is
      # a SENSITIVE_KEYS config value. Without the key, get_config ERROR-
      # logs the decryption failure and the poll skips the manager — a
      # loud failure (PR 1's fail-loud fix), but still a failure. Keep it
      # set so it never comes to that.
      - key: CONFIG_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MANAGER_TOOL_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.11"

  - type: cron
    name: backup-db
    runtime: python
    repo: https://github.com/toddaerickson/manager-tool
    rootDir: manager-tool-django
    plan: starter
    region: oregon
    branch: main
    schedule: "0 13 * * *"  # daily 9 AM ET (UTC-4)
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py backup_db
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MANAGER_TOOL_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.11"
      # Retention: number of daily snapshots to keep locally.
      # - key: BACKUP_RETENTION
      #   value: "7"
      # Optional OFF-SITE copy. Render cron disks are ephemeral (the local
      # snapshot vanishes after the job), so to keep a durable backup set
      # BACKUP_S3_BUCKET + AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY and the
      # snapshot is also uploaded to S3. Commented out until you configure a
      # bucket — until then the snapshot is written to the job's ephemeral
      # disk only (still produced every run, but not retained).
      # - key: BACKUP_S3_BUCKET
      #   sync: false
